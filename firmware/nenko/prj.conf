# --- USB CDC ACM (stack legacy) ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="DOMOS Nenko Bridge"
CONFIG_USB_DEVICE_PID=0x000a
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# La console/printk va sulla CDC ACM USB
CONFIG_STDOUT_CONSOLE=y

# --- Radio IEEE 802.15.4 "nuda" (senza stack di rete L2) ---
# Vogliamo parlare direttamente al driver radio, non passare dal networking.
CONFIG_NETWORKING=y
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_IEEE802154=y
CONFIG_IEEE802154_NRF5=y

# Buffer per costruire i net_pkt/net_buf di trasmissione
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=128

# Log minimale (utile in debug, si puo' mettere a n)
CONFIG_LOG=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
# printk diretto sulla console USB, SENZA passare dal logging deferred di Zephyr
# (che svuota il buffer ~1 volta/secondo): cosi' l'ACK "OK n byte" esce subito.
CONFIG_LOG_PRINTK=n

# Heap per l'allocazione dei net_pkt
CONFIG_HEAP_MEM_POOL_SIZE=4096
